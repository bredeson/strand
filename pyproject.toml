[build-system]
requires = ['setuptools>=80','setuptools-scm[simple]>=9.2']
build-backend = 'setuptools.build_meta'

[project]
name = 'strand'
dynamic = ['version']
description = 'Python module providing a strand object API'
requires-python = '>= 3.5'
authors = [
  {name='Jessen V. Bredeson', email = 'jessenbredeson@berkeley.edu'}
]
keywords = ['strand','dna']
classifiers = [
  'Intended Audience :: Science/Research',
  'Programming Language :: Python',
  'Topic :: Scientific/Engineering :: Bio-Informatics',
  'Topic :: Software Development :: Libraries :: Python Modules'
]
readme = {file = 'README.md', content-type = 'GFM'}
license-files = ['LICENSE']

[project.urls]
GitHub = 'https://github.com/bredeson/strand'
Repository = 'https://github.com/bredeson/strand.git'

[tool.setuptools.packages.find]
where = ['src']

